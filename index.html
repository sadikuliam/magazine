<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine Flipbook</title>

<style>
  :root{
    --ink:#1c1a17;
    --paper:#f6f2ea;
    --paper-dark:#e9e2d3;
    --accent:#8a3b2b;
    --accent-soft:#c98a6f;
    --shadow: rgba(20,15,10,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, #2a2621 0%, #14110e 60%, #0c0a08 100%);
    color:var(--paper);
    font-family: "Iowan Old Style","Palatino Linotype",Georgia,serif;
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; width:100%; position:relative;
  }

  /* --- Header --- */
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    font-size:13px; letter-spacing:.04em;
    color:#cfc6b5;
    z-index:20;
    pointer-events:none;
  }
  #topbar .title{ font-style:italic; opacity:.85; }
  #topbar .controls{ pointer-events:auto; display:flex; gap:10px; }
  .iconbtn{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    color:#f1ead9;
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:15px; transition:background .15s ease, transform .15s ease;
  }
  .iconbtn:hover{ background:rgba(255,255,255,0.16); transform:translateY(-1px); }

  /* --- Loading state --- */
  #loading{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:30;
    transition:opacity .4s ease;
  }
  #loading .ring{
    width:38px;height:38px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:var(--accent-soft);
    animation:spin 0.9s linear infinite;
  }
  #loading .msg{ font-size:13px; color:#bfb6a4; letter-spacing:.03em; }
  #loading .pct{ font-size:11px; color:#8a8071; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* --- Book stage --- */
  #stage{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
  }
  #book{
    box-shadow: 0 30px 80px var(--shadow);
  }
  .page-content{
    width:100%; height:100%;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .page-content canvas{
    max-width:100%; max-height:100%; display:block;
  }
  .page-content.blank{
    background: linear-gradient(135deg, var(--paper) 0%, var(--paper-dark) 100%);
  }
  .page-number{
    position:absolute; bottom:6px; width:100%; text-align:center;
    font-size:10px; color:#8a7f6a; letter-spacing:.08em;
  }

  /* --- Bottom bar --- */
  #bottombar{
    position:absolute; bottom:18px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:18px;
    z-index:20;
  }
  #pageIndicator{
    font-size:12px; color:#cfc6b5; min-width:70px; text-align:center; letter-spacing:.03em;
  }
  #progressTrack{
    width:min(40vw, 320px); height:3px; background:rgba(255,255,255,0.12); border-radius:2px; overflow:hidden;
    cursor:pointer;
  }
  #progressFill{
    height:100%; width:0%; background:var(--accent-soft); transition:width .25s ease;
  }

  .navzone{
    position:absolute; top:0; bottom:0; width:14%; z-index:15;
    cursor:pointer; background:transparent; border:none;
  }
  .navzone.left{ left:0; }
  .navzone.right{ right:0; }

  @media (max-width:700px){
    #topbar .title{ display:none; }
    #progressTrack{ width:48vw; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="topbar">
    <div class="title">Magazine · Flipbook</div>
    <div class="controls">
      <button class="iconbtn" id="zoomOutBtn" title="Zoom out">&minus;</button>
      <button class="iconbtn" id="zoomInBtn" title="Zoom in">+</button>
      <button class="iconbtn" id="fullscreenBtn" title="Fullscreen">&#x26F6;</button>
    </div>
  </div>

  <div id="loading">
    <div class="ring"></div>
    <div class="msg" id="loadingMsg">Opening magazine…</div>
    <div class="pct" id="loadingPct"></div>
  </div>

  <div id="stage">
    <button class="navzone left" id="navLeft" aria-label="Previous page"></button>
    <div id="book"></div>
    <button class="navzone right" id="navRight" aria-label="Next page"></button>
  </div>

  <div id="bottombar">
    <div id="pageIndicator">– / –</div>
    <div id="progressTrack"><div id="progressFill"></div></div>
  </div>

</div>

<!-- PDF.js (renders your PDF pages to canvas) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- page-flip (the realistic page turning effect) -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
/* ======================================================================
   CONFIG — this is the only line you should need to change.
   Point it at the raw GitHub URL of your PDF, e.g.:
   "https://raw.githubusercontent.com/USERNAME/REPO/main/magaz.pdf"
   ====================================================================== */
const PDF_URL = "magaz.pdf"; // <-- put your raw GitHub PDF URL here

/* Rendering config tuned for speed */
const FIRST_PAGES_FAST = 4;      // pages rendered immediately, low-res, so the book opens instantly
const FAST_SCALE = 0.55;         // low-res pass (loads fast)
const FULL_SCALE = 1.35;         // high-res pass (loads in background)
const RENDER_AHEAD = 2;          // how many pages ahead/behind to keep hi-res ready
/* ====================================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingMsg');
const loadingPct = document.getElementById('loadingPct');
const bookEl = document.getElementById('book');
const pageIndicator = document.getElementById('pageIndicator');
const progressFill = document.getElementById('progressFill');
const progressTrack = document.getElementById('progressTrack');

let pdfDoc = null;
let pageFlip = null;
let totalPages = 0;
let hiResDone = new Set();
let pageAspect = 1.4142; // A4-ish default until we know real size

function setLoading(msg, pct){
  loadingMsg.textContent = msg;
  loadingPct.textContent = pct != null ? pct + '%' : '';
}

async function renderPageToCanvas(pageNum, scale){
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

function makePageDiv(innerNode, num){
  const div = document.createElement('div');
  div.className = 'page-content';
  div.dataset.pageNum = num;
  if (innerNode) div.appendChild(innerNode);
  const label = document.createElement('div');
  label.className = 'page-number';
  label.textContent = num;
  div.appendChild(label);
  return div;
}

async function upgradePage(num){
  if (hiResDone.has(num) || num < 1 || num > totalPages) return;
  hiResDone.add(num);
  try{
    const canvas = await renderPageToCanvas(num, FULL_SCALE);
    const target = bookEl.querySelector('.page-content[data-page-num="'+num+'"]');
    if (target){
      const old = target.querySelector('canvas');
      canvas.style.opacity = 0;
      target.insertBefore(canvas, target.firstChild);
      requestAnimationFrame(()=>{ canvas.style.transition='opacity .25s ease'; canvas.style.opacity=1; });
      if (old) setTimeout(()=> old.remove(), 260);
    }
  } catch(e){ console.warn('hi-res render failed for page', num, e); }
}

function upgradeAround(centerIndex){
  for (let d=-RENDER_AHEAD; d<=RENDER_AHEAD; d++){
    upgradePage(centerIndex + 1 + d);
  }
}

function updateIndicator(){
  const idx = pageFlip.getCurrentPageIndex();
  const shown = Math.min(idx+1, totalPages);
  pageIndicator.textContent = shown + ' / ' + totalPages;
  progressFill.style.width = ((idx+1)/totalPages*100) + '%';
}

async function init(){
  try{
    setLoading('Fetching magazine…', null);
    const loadingTask = pdfjsLib.getDocument({ url: PDF_URL });
    loadingTask.onProgress = (p)=>{
      if (p.total){
        const pct = Math.round((p.loaded/p.total)*100);
        setLoading('Downloading pages…', pct);
      }
    };
    pdfDoc = await loadingTask.promise;
    totalPages = pdfDoc.numPages;

    // Get aspect ratio from page 1 so the book frame is sized correctly.
    const firstPage = await pdfDoc.getPage(1);
    const vp = firstPage.getViewport({ scale: 1 });
    pageAspect = vp.height / vp.width;

    setLoading('Rendering first pages…', 0);

    // Fast pass: render just enough pages to open the book immediately.
    const fastCount = Math.min(FIRST_PAGES_FAST, totalPages);
    const fastCanvases = [];
    for (let i=1; i<=fastCount; i++){
      fastCanvases.push(await renderPageToCanvas(i, FAST_SCALE));
      setLoading('Rendering first pages…', Math.round(i/fastCount*100));
    }

    // Build DOM pages: real content for the fast-rendered ones, lightweight
    // placeholders for the rest (rendered on demand as the reader flips).
    for (let i=1; i<=totalPages; i++){
      let div;
      if (i <= fastCount){
        div = makePageDiv(fastCanvases[i-1], i);
      } else {
        div = makePageDiv(null, i);
        div.classList.add('blank');
      }
      bookEl.appendChild(div);
    }

    sizeBook();

    pageFlip = new St.PageFlip(bookEl, {
      width: 500,
      height: Math.round(500 * pageAspect),
      size: 'stretch',
      minWidth: 280,
      maxWidth: 1200,
      minHeight: 360,
      maxHeight: 1600,
      showCover: true,
      maxShadowOpacity: 0.5,
      mobileScrollSupport: true,
      usePortrait: window.innerWidth < 800,
      flippingTime: 650
    });

    pageFlip.loadFromHTML(document.querySelectorAll('#book .page-content'));

    pageFlip.on('flip', (e)=>{
      updateIndicator();
      upgradeAround(e.data);
      renderPlaceholderIfNeeded(e.data);
    });

    updateIndicator();
    upgradeAround(0);

    // Render remaining pages lazily, lowest priority, in the background
    // so the reader never waits — pages just get sharper as you go.
    backgroundFillRemaining(fastCount);

    loadingEl.style.opacity = 0;
    setTimeout(()=> loadingEl.style.display='none', 400);

  } catch(err){
    console.error(err);
    setLoading('Could not load the PDF. Check PDF_URL in the code.', null);
  }
}

async function renderPlaceholderIfNeeded(centerIndex){
  const num = centerIndex + 1;
  const div = bookEl.querySelector('.page-content[data-page-num="'+num+'"]');
  if (div && div.classList.contains('blank') && !div.querySelector('canvas')){
    div.classList.remove('blank');
    const canvas = await renderPageToCanvas(num, FAST_SCALE);
    div.insertBefore(canvas, div.firstChild);
    hiResDone.delete(num);
    upgradePage(num);
  }
}

async function backgroundFillRemaining(startAfter){
  for (let i=startAfter+1; i<=totalPages; i++){
    const div = bookEl.querySelector('.page-content[data-page-num="'+i+'"]');
    if (div && !div.querySelector('canvas')){
      try{
        const canvas = await renderPageToCanvas(i, FAST_SCALE);
        div.classList.remove('blank');
        div.insertBefore(canvas, div.firstChild);
      } catch(e){ /* ignore, will retry on flip */ }
    }
    await new Promise(r=>setTimeout(r, 30)); // yield to keep UI smooth
  }
}

function sizeBook(){
  const maxH = window.innerHeight * 0.82;
  const maxW = window.innerWidth * 0.9;
  let h = maxH;
  let w = h / pageAspect;
  if (w * 2 > maxW){ w = maxW/2; h = w*pageAspect; }
  bookEl.style.width = Math.round(w*2)+'px';
  bookEl.style.height = Math.round(h)+'px';
}

window.addEventListener('resize', ()=>{ sizeBook(); if(pageFlip) pageFlip.updateSize(); });

document.getElementById('navLeft').addEventListener('click', ()=> pageFlip && pageFlip.flipPrev());
document.getElementById('navRight').addEventListener('click', ()=> pageFlip && pageFlip.flipNext());
document.addEventListener('keydown', (e)=>{
  if (!pageFlip) return;
  if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  if (e.key === 'ArrowRight') pageFlip.flipNext();
});

let currentZoom = 1;
document.getElementById('zoomInBtn').addEventListener('click', ()=>{
  currentZoom = Math.min(currentZoom + 0.15, 2);
  bookEl.style.transform = 'scale('+currentZoom+')';
});
document.getElementById('zoomOutBtn').addEventListener('click', ()=>{
  currentZoom = Math.max(currentZoom - 0.15, 0.6);
  bookEl.style.transform = 'scale('+currentZoom+')';
});
document.getElementById('fullscreenBtn').addEventListener('click', ()=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

progressTrack.addEventListener('click', (e)=>{
  if (!pageFlip) return;
  const rect = progressTrack.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const target = Math.max(0, Math.min(totalPages-1, Math.round(ratio * (totalPages-1))));
  pageFlip.flip(target);
});

init();
</script>
</body>
</html>
