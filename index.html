<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Fast Premium Flipbook</title>
    
    <style>
        :root {
            --bg: #070a10;
            --text: #f4f7fb;
            --accent: #55d6ff;
        }
        body {
            background: linear-gradient(145deg, #070a10, #0c111b 55%, #080b12);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Inter, system-ui, sans-serif;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .flip-book {
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: none;
        }
        .page {
            background-color: white;
            border: solid 1px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .page-loader {
            color: #9aa5b5;
            font-size: 14px;
        }
        .loader-container {
            text-align: center;
            position: absolute;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loader-text { font-size: 16px; color: #9aa5b5; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loader-container">
            <div class="spinner"></div>
            <div id="loader-text" class="loader-text">Opening Book...</div>
        </div>
        
        <div id="flipbook" class="flip-book">
            <!-- Pages will be injected here dynamically -->
        </div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        const pdfUrl = 'magaz.pdf'; 
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function renderFlipbook() {
            try {
                const loading = document.getElementById('loading');
                const flipbookEl = document.getElementById('flipbook');

                // পিডিএফ এর ডেটা লোড করা হচ্ছে
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const numPages = pdf.numPages;

                // বইয়ের আকার নির্ধারণের জন্য শুধু প্রথম পেজ পড়া
                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 1.5 });

                // সাথে সাথে সবগুলো পেজের জন্য খালি জায়গা (Placeholder) তৈরি করা
                for (let i = 1; i <= numPages; i++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.id = `page-${i}`;
                    pageDiv.innerHTML = `<div class="page-loader">Loading page...</div>`;
                    flipbookEl.appendChild(pageDiv);
                }

                // StPageFlip চালু করা
                const pageFlip = new St.PageFlip(flipbookEl, {
                    width: viewport.width,
                    height: viewport.height,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1350,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false
                });

                // ফ্লিপবুকটি সাথে সাথে স্ক্রিনে দেখিয়ে দেওয়া হচ্ছে
                loading.style.display = 'none';
                flipbookEl.style.display = 'block';
                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // একটি নির্দিষ্ট পেজ রেন্ডার করার ফাংশন
                async function renderPageToCanvas(pageNum) {
                    try {
                        const page = await pdf.getPage(pageNum);
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        const pageDiv = document.getElementById(`page-${pageNum}`);
                        if(pageDiv) {
                            pageDiv.innerHTML = ''; 
                            pageDiv.appendChild(canvas);
                        }
                    } catch (e) {
                        console.error(`Error rendering page ${pageNum}`, e);
                    }
                }

                // ব্যবহারকারী যেন সাথে সাথে পড়তে পারে তাই প্রথম ৩টি পেজ দ্রুত লোড করা হচ্ছে
                await renderPageToCanvas(1);
                if(numPages >= 2) await renderPageToCanvas(2);
                if(numPages >= 3) await renderPageToCanvas(3);

                // বাকি পেজগুলো ব্যাকগ্রাউন্ডে ধীরে ধীরে লোড হবে, এতে ব্রাউজার স্লো হবে না
                let currentPageToRender = 4;
                function renderNextPage() {
                    if (currentPageToRender <= numPages) {
                        renderPageToCanvas(currentPageToRender).then(() => {
                            currentPageToRender++;
                            setTimeout(renderNextPage, 150); // ব্রাউজারকে বিশ্রাম দেওয়ার জন্য ছোট বিরতি
                        });
                    }
                }
                
                if(numPages >= 4) {
                    renderNextPage();
                }

            } catch (error) {
                console.error("PDF Loading Error:", error);
                document.getElementById('loader-text').innerText = "Error loading PDF.";
                document.querySelector('.spinner').style.display = 'none';
            }
        }

        renderFlipbook();
    </script>
</body>
</html>
