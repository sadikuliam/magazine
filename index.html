<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Ultimate Flipbook</title>
    
    <style>
        :root {
            --bg: #070a10;
            --text: #f4f7fb;
            --accent: #55d6ff;
        }
        body {
            background: linear-gradient(145deg, #070a10, #0c111b 55%, #080b12);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Inter, system-ui, sans-serif;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .flip-book {
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            display: none;
        }
        .page {
            background-color: #ffffff;
            border: solid 1px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        /* Loading text behind the image */
        .page-num {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d1d5db;
            font-size: 18px;
            font-weight: 500;
            z-index: 1;
        }
        /* Actual page image */
        .page-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0; 
            transition: opacity 0.4s ease-in-out;
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
            background: white;
        }
        /* Spinner Styles */
        .loader-container {
            text-align: center;
            position: absolute;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loader-text { font-size: 16px; color: #9aa5b5; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loader-container">
            <div class="spinner"></div>
            <div id="loader-text" class="loader-text">Connecting...</div>
        </div>
        
        <div id="flipbook" class="flip-book">
            <!-- Pages inject হবে এখানে -->
        </div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        const pdfUrl = 'magaz.pdf'; 
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function initFlipbook() {
            const loading = document.getElementById('loading');
            const loaderText = document.getElementById('loader-text');
            const flipbookEl = document.getElementById('flipbook');

            try {
                loaderText.innerText = "Loading Structure...";
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const numPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 1.5 });

                // সাথে সাথেই পুরো বইয়ের স্ট্রাকচার তৈরি করে ফেলা হচ্ছে
                for (let i = 1; i <= numPages; i++) {
                    const div = document.createElement('div');
                    div.className = 'page';
                    div.innerHTML = `
                        <div class="page-num">Loading Page ${i}...</div>
                        <img id="img-page-${i}" class="page-image" alt="Page ${i}" />
                    `;
                    flipbookEl.appendChild(div);
                }

                // StPageFlip চালু করা
                const pageFlip = new St.PageFlip(flipbookEl, {
                    width: viewport.width,
                    height: viewport.height,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1350,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // লোডিং স্ক্রিন সরিয়ে বইটি দেখিয়ে দেওয়া
                loading.style.display = 'none';
                flipbookEl.style.display = 'block';

                // পেজ রেন্ডার করে ইমেজে রূপান্তরের ফাংশন
                async function renderPageAsImage(pageNum) {
                    try {
                        const page = await pdf.getPage(pageNum);
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        // ক্যানভাসকে ইমেজে রূপান্তর করে <img> ট্যাগে বসানো
                        const img = document.getElementById(`img-page-${pageNum}`);
                        if(img) {
                            img.src = canvas.toDataURL("image/jpeg", 0.85);
                            img.style.opacity = "1"; // ফেড-ইন ইফেক্ট
                        }
                    } catch (e) {
                        console.error(`Page ${pageNum} render error:`, e);
                    }
                }

                // প্রথম ৩টি পেজ দ্রুত লোড করা
                await renderPageAsImage(1);
                if(numPages >= 2) await renderPageAsImage(2);
                if(numPages >= 3) await renderPageAsImage(3);

                // বাকি পেজগুলো ইউজারের অজান্তেই ব্যাকগ্রাউন্ডে লোড হতে থাকবে
                for(let i = 4; i <= numPages; i++) {
                    await new Promise(resolve => setTimeout(resolve, 150)); // ব্রাউজার স্মুথ রাখার জন্য গ্যাপ
                    await renderPageAsImage(i);
                }

            } catch (error) {
                console.error("Critical Error:", error);
                loaderText.innerText = "Error: Could not load magaz.pdf. Ensure the file name is exact.";
                document.querySelector('.spinner').style.display = 'none';
            }
        }

        initFlipbook();
    </script>
</body>
</html>
