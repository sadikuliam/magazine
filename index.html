html,body{

body{

}

/* ================= HEADER ================= */

.header{

    display:flex;

}

.book{
    position:relative;
    width:min(92vw,900px);
    height:min(88vh,1200px);
    max-height:calc(100vh - 110px);
    perspective:2200px;
}

/* page background */

.pageBase,
.pageFlip{
    position:absolute;
    inset:0;
    background:#fff;
    border-radius:2px;
    box-shadow:
        0 18px 50px rgba(0,0,0,.45),
        0 0 0 1px rgba(0,0,0,.12);
    overflow:hidden;
}

.pageBase{
    z-index:1;
}

/* animated page */

.pageFlip{
    z-index:3;
    transform-origin:left center;
    backface-visibility:hidden;
    transform-style:preserve-3d;
}

.pageFlip.next{
    transform-origin:right center;
}

.pageFlip.animateNext{
    animation:flipNext .65s cubic-bezier(.2,.65,.25,1) forwards;
}

.pageFlip.animatePrev{
    transform-origin:left center;
    animation:flipPrev .65s cubic-bezier(.2,.65,.25,1) forwards;
}

@keyframes flipNext{
    0%{
        transform:rotateY(0deg);
    }

    100%{
        transform:rotateY(-180deg);
    }
}

@keyframes flipPrev{
    0%{
        transform:rotateY(0deg);
    }

    100%{
        transform:rotateY(180deg);
    }
}

canvas{

<script type="module">

/* =========================================================
   PDF.JS
========================================================= */

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


/* =========================================================
   CONFIG
========================================================= */

const PDF_FILE = "./magaz.pdf";

const RENDER_SCALE = 1.35;


/* =========================================================
   DOM
========================================================= */

const book =
document.getElementById("book");

const baseCanvas =
document.getElementById("baseCanvas");

const flipCanvas =
document.getElementById("flipCanvas");

const baseCtx =
baseCanvas.getContext("2d");

const flipCtx =
flipCanvas.getContext("2d");

const loader =
document.getElementById("loader");

const loaderTitle =
document.getElementById("loaderTitle");

const loaderText =
document.getElementById("loaderText");

const progressBar =
document.getElementById("progressBar");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");

const retryBtn =
document.getElementById("retryBtn");

const counter =
document.getElementById("counter");

const status =
document.getElementById("status");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const fullBtn =
document.getElementById("fullBtn");

const pdfBtn =
document.getElementById("pdfBtn");

const flipPage =
document.getElementById("flipPage");


/* =========================================================
   STATE
========================================================= */

let pdf = null;

let totalPages = 0;

let currentPage = 1;

let busy = false;

let rendered = new Map();

let pageRatio = 1;


/* =========================================================
   HELPERS
========================================================= */

function setProgress(value){

    progressBar.style.width =
    Math.max(
        0,
        Math.min(100,value)
    ) + "%";

}


function showLoader(title,text,progress){

    loaderTitle.textContent =
    title;

    loaderText.textContent =
    text;

    setProgress(progress);

    loader.classList.remove("hide");

}


function hideLoader(){

    loader.classList.add("hide");

}


function updateCounter(){

    counter.textContent =
    `${currentPage} / ${totalPages}`;

    prevBtn.disabled =
    currentPage <= 1;

    nextBtn.disabled =
    currentPage >= totalPages;

    status.textContent =
    `Page ${currentPage} of ${totalPages}`;
}


/* =========================================================
   GET DISPLAY SIZE
========================================================= */

function getDisplaySize(){

    const rect =
    book.getBoundingClientRect();

    let width =
    rect.width;

    let height =
    width / pageRatio;

    const maxHeight =
    rect.height;

    if(height > maxHeight){

        height =
        maxHeight;

        width =
        height * pageRatio;
    }

    return {
        width:Math.max(100,Math.floor(width)),
        height:Math.max(100,Math.floor(height))
    };
}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(pageNumber){

    if(
        pageNumber < 1 ||
        pageNumber > totalPages
    ){
        return null;
    }

    if(
        rendered.has(pageNumber)
    ){
        return rendered.get(pageNumber);
    }

    const page =
    await pdf.getPage(pageNumber);

    const viewport =
    page.getViewport({
        scale:RENDER_SCALE
    });

    const canvas =
    document.createElement("canvas");

    const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:false
        }
    );

    canvas.width =
    Math.ceil(viewport.width);

    canvas.height =
    Math.ceil(viewport.height);

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    await page.render({

        canvasContext:ctx,

        viewport:viewport,

        intent:"display"

    }).promise;

    rendered.set(
        pageNumber,
        canvas
    );

    return canvas;
}


/* =========================================================
   DRAW PAGE INTO DISPLAY CANVAS
========================================================= */

function drawCanvas(
    targetCanvas,
    sourceCanvas
){

    if(!sourceCanvas){
        return;
    }

    const size =
    getDisplaySize();

    const dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

    targetCanvas.width =
    Math.floor(
        size.width * dpr
    );

    targetCanvas.height =
    Math.floor(
        size.height * dpr
    );

    targetCanvas.style.width =
    size.width + "px";

    targetCanvas.style.height =
    size.height + "px";

    const ctx =
    targetCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        targetCanvas.width,
        targetCanvas.height
    );

    ctx.fillStyle =
    "#fff";

    ctx.fillRect(
        0,
        0,
        targetCanvas.width,
        targetCanvas.height
    );

    /*
       contain
    */

    const sourceRatio =
    sourceCanvas.width /
    sourceCanvas.height;

    const targetRatio =
    targetCanvas.width /
    targetCanvas.height;

    let drawWidth =
    targetCanvas.width;

    let drawHeight =
    targetCanvas.height;

    let x = 0;
    let y = 0;

    if(sourceRatio > targetRatio){

        drawWidth =
        targetCanvas.width;

        drawHeight =
        drawWidth / sourceRatio;

        y =
        (targetCanvas.height - drawHeight) / 2;

    }else{

        drawHeight =
        targetCanvas.height;

        drawWidth =
        drawHeight * sourceRatio;

        x =
        (targetCanvas.width - drawWidth) / 2;
    }

    ctx.drawImage(

        sourceCanvas,

        x,
        y,
        drawWidth,
        drawHeight

    );
}


/* =========================================================
   SHOW CURRENT PAGE
========================================================= */

async function showPage(){

    const canvas =
    await renderPage(currentPage);

    drawCanvas(
        baseCanvas,
        canvas
    );

    updateCounter();
}


/* =========================================================
   PRELOAD
========================================================= */

function preloadNearby(){

    const pages = [

        currentPage - 1,
        currentPage + 1,
        currentPage + 2

    ];

    /*
       Render in background.
       Do not block the reader.
    */

    pages.forEach(
        pageNumber => {

            if(
                pageNumber >= 1 &&
                pageNumber <= totalPages
            ){

                renderPage(pageNumber)
                .catch(console.warn);

            }

        }
    );
}


/* =========================================================
   NEXT PAGE
========================================================= */

async function nextPage(){

    if(
        busy ||
        currentPage >= totalPages
    ){
        return;
    }

    busy = true;

    const oldPage =
    currentPage;

    const newPage =
    currentPage + 1;

    try{

        const oldCanvas =
        await renderPage(oldPage);

        const newCanvas =
        await renderPage(newPage);

        /*
           Flip layer gets current page.
        */

        drawCanvas(
            flipCanvas,
            oldCanvas
        );

        /*
           Base gets next page immediately
           behind the flipping page.
        */

        drawCanvas(
            baseCanvas,
            newCanvas
        );

        flipPage.classList.remove(
            "animatePrev",
            "animateNext"
        );

        void flipPage.offsetWidth;

        flipPage.classList.add(
            "animateNext"
        );

        await wait(650);

        flipPage.classList.remove(
            "animateNext"
        );

        currentPage =
        newPage;

        updateCounter();

        preloadNearby();

    }catch(error){

        console.error(error);

    }finally{

        busy = false;

    }
}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

async function prevPage(){

    if(
        busy ||
        currentPage <= 1
    ){
        return;
    }

    busy = true;

    const oldPage =
    currentPage;

    const newPage =
    currentPage - 1;

    try{

        const oldCanvas =
        await renderPage(oldPage);

        const newCanvas =
        await renderPage(newPage);

        drawCanvas(
            flipCanvas,
            oldCanvas
        );

        drawCanvas(
            baseCanvas,
            newCanvas
        );

        /*
           Reverse direction
        */

        flipPage.classList.remove(
            "animateNext",
            "animatePrev"
        );

        void flipPage.offsetWidth;

        flipPage.classList.add(
            "animatePrev"
        );

        await wait(650);

        flipPage.classList.remove(
            "animatePrev"
        );

        currentPage =
        newPage;

        updateCounter();

        preloadNearby();

    }catch(error){

        console.error(error);

    }finally{

        busy = false;

    }
}


/* =========================================================
   WAIT
========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
        setTimeout(resolve,ms)
    );
}


/* =========================================================
   LOAD PDF
========================================================= */

async function loadPDF(){

    errorBox.classList.remove("show");

    showLoader(
        "Loading Magazine",
        "Connecting to magaz.pdf...",
        5
    );

    try{

        rendered.clear();

        /*
           Cache-busting is used only for reloads
           after replacing the PDF.
        */

        const url =
        PDF_FILE +
        "?v=" +
        Date.now();

        const loadingTask =
        pdfjsLib.getDocument({

            url:url,

            disableStream:false,

            disableAutoFetch:false,

            rangeChunkSize:65536

        });

        loadingTask.onProgress =
        progress => {

            if(
                progress.total
            ){

                const percent =
                (progress.loaded /
                 progress.total) * 70;

                showLoader(
                    "Downloading Magazine",
                    `${Math.round(percent)}%`,
                    percent
                );
            }

        };

        pdf =
        await loadingTask.promise;

        totalPages =
        pdf.numPages;

        if(!totalPages){

            throw new Error(
                "No pages found in PDF."
            );
        }

        showLoader(
            "Preparing Magazine",
            `${totalPages} pages found...`,
            78
        );

        /*
           Determine original PDF aspect ratio.
        */

        const first =
        await pdf.getPage(1);

        const firstViewport =
        first.getViewport({
            scale:1
        });

        pageRatio =
        firstViewport.width /
        firstViewport.height;

        currentPage = 1;

        /*
           First page = priority.
        */

        const firstCanvas =
        await renderPage(1);

        drawCanvas(
            baseCanvas,
            firstCanvas
        );

        updateCounter();

        showLoader(
            "Almost Ready",
            "Preparing next pages...",
            92
        );

        /*
           Preload the next page.
        */

        if(totalPages >= 2){

            await renderPage(2);
        }

        /*
           Show reader.
        */

        hideLoader();

        preloadNearby();

        status.textContent =
        `Ready • ${totalPages} pages`;

    }catch(error){

        console.error(
            "PDF ERROR:",
            error
        );

        let message =
        `
        Could not load <b>magaz.pdf</b>.<br><br>
        Make sure the file is exactly named
        <b>magaz.pdf</b> and is in the same folder
        as <b>index.html</b>.
        `;

        if(error && error.message){

            message +=
            `<br><br>
             <small>${escapeHTML(
                 error.message
             )}</small>`;
        }

        errorText.innerHTML =
        message;

        errorBox.classList.add(
            "show"
        );

        hideLoader();

        status.textContent =
        "PDF loading failed";
    }
}


/* =========================================================
   ESCAPE ERROR TEXT
========================================================= */

function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreen(){

    try{

        if(!document.fullscreenElement){

            await document
            .getElementById("reader")
            .requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

        console.warn(error);

    }

}


/* =========================================================
   OPEN ORIGINAL PDF
========================================================= */

function openPDF(){

    window.open(
        PDF_FILE,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

nextBtn.addEventListener(
    "click",
    nextPage
);

prevBtn.addEventListener(
    "click",
    prevPage
);

fullBtn.addEventListener(
    "click",
    fullscreen
);

pdfBtn.addEventListener(
    "click",
    openPDF
);

retryBtn.addEventListener(
    "click",
    loadPDF
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.ctrlKey ||
            event.metaKey ||
            event.altKey
        ){
            return;
        }

        if(event.key === "ArrowRight"){

            event.preventDefault();

            nextPage();

        }

        if(event.key === "ArrowLeft"){

            event.preventDefault();

            prevPage();

        }

        if(
            event.key === "f" ||
            event.key === "F"
        ){

            fullscreen();

        }

        if(event.key === "Home"){

            if(
                currentPage !== 1 &&
                !busy
            ){

                currentPage = 1;

                showPage();

                preloadNearby();
            }

        }

        if(event.key === "End"){

            if(
                currentPage !== totalPages &&
                !busy
            ){

                currentPage =
                totalPages;

                showPage();

                preloadNearby();
            }

        }

    }
);


/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

book.addEventListener(
    "touchstart",
    event => {

        const touch =
        event.changedTouches[0];

        touchStartX =
        touch.clientX;

        touchStartY =
        touch.clientY;

    },
    {
        passive:true
    }
);


book.addEventListener(
    "touchend",
    event => {

        const touch =
        event.changedTouches[0];

        const deltaX =
        touch.clientX - touchStartX;

        const deltaY =
        touch.clientY - touchStartY;

        /*
           Ignore vertical scrolling gestures.
        */

        if(
            Math.abs(deltaX) > 60 &&
            Math.abs(deltaX) > Math.abs(deltaY)
        ){

            if(deltaX < 0){

                nextPage();

            }else{

                prevPage();

            }

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
        setTimeout(
            () => {

                if(!pdf){
                    return;
                }

                const currentCanvas =
                rendered.get(currentPage);

                if(currentCanvas){

                    drawCanvas(
                        baseCanvas,
                        currentCanvas
                    );

                }

            },
            150
        );

    }
);
