<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Super Fast Flipbook</title>
    
    <style>
        :root { --bg: #070a10; --accent: #55d6ff; }
        body {
            background: linear-gradient(145deg, #070a10, #0c111b 55%, #080b12);
            margin: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: system-ui, sans-serif;
        }
        .container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .flip-book { display: none; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .page { background: #ffffff; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,0.1); }
        
        .page-text { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; color: #a1a1aa; font-size: 14px; z-index: 1; }
        .page-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; opacity: 0; transition: opacity 0.3s; background: white; }
        
        .loader { text-align: center; position: absolute; color: #9aa5b5; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <div id="load-text">Optimizing Book...</div>
        </div>
        <div id="flipbook" class="flip-book"></div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        const pdfUrl = 'magaz.pdf'; 
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function loadFastFlipbook() {
            const loader = document.getElementById('loader');
            const loadText = document.getElementById('load-text');
            const fb = document.getElementById('flipbook');

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const totalPages = pdf.numPages;
                const firstPage = await pdf.getPage(1);
                
                // স্পিড বাড়ানোর প্রধান ট্রিক: Scale কমানো হয়েছে এবং মোবাইলের জন্য আলাদা সাইজ দেওয়া হয়েছে
                const isMobile = window.innerWidth < 768;
                const renderScale = isMobile ? 0.8 : 1.0; 
                const vp = firstPage.getViewport({ scale: renderScale });

                // চোখের পলকে বইয়ের কাঠামো তৈরি
                for (let i = 1; i <= totalPages; i++) {
                    const div = document.createElement('div');
                    div.className = 'page';
                    div.innerHTML = `<div class="page-text">Loading Page ${i}...</div><img id="pimg-${i}" class="page-img">`;
                    fb.appendChild(div);
                }

                // ফ্লিপবুক চালু করা
                const pageFlip = new St.PageFlip(fb, {
                    width: vp.width, height: vp.height,
                    size: "stretch", minWidth: 300, maxWidth: 1000, minHeight: 400, maxHeight: 1350,
                    showCover: true, mobileScrollSupport: true
                });
                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                loader.style.display = 'none';
                fb.style.display = 'block';

                // ফাস্ট রেন্ডারিং ফাংশন
                async function renderPage(num) {
                    try {
                        const p = await pdf.getPage(num);
                        const canvas = document.createElement('canvas');
                        canvas.width = vp.width; canvas.height = vp.height;
                        await p.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                        
                        const img = document.getElementById(`pimg-${num}`);
                        if(img) {
                            // কোয়ালিটি 80% করে মেমরি কমানো হয়েছে (0.8)
                            img.src = canvas.toDataURL('image/jpeg', 0.8);
                            img.style.opacity = '1';
                        }
                    } catch(e) { console.log(e); }
                }

                // প্রথম ২টা পেজ সবার আগে লোড হবে
                await renderPage(1);
                if(totalPages >= 2) await renderPage(2);

                // বাকি পেজগুলো প্যারালালি ব্যাকগ্রাউন্ডে লোড হবে ব্রাউজারকে ফ্রি রেখে
                for (let i = 3; i <= totalPages; i++) {
                    await new Promise(r => setTimeout(r, 80)); 
                    renderPage(i); // await ছাড়া কল করায় এটি ব্যাকগ্রাউন্ডে দ্রুত কাজ করবে
                }

            } catch (error) {
                loadText.innerText = "Error loading PDF.";
                document.querySelector('.spinner').style.display = 'none';
            }
        }

        loadFastFlipbook();
    </script>
</body>
</html>
