<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine - Flipbook</title>
    
    <!-- CDN Preconnect -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <!-- dFlip CSS -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .read-btn {
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
        }

        /* --- dFlip থিম কাস্টমাইজেশন --- */
        .df-lightbox-wrapper, .df-container { 
            background-color: #e9ecef !important; 
        }
        .df-ui-controls { 
            background-color: #2c3e50 !important;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2) !important;
        }
        .df-ui-btn, .df-ui-page-info { color: #ffffff !important; }
        .df-ui-btn:hover { 
            background-color: #34495e !important; 
            color: #f1c40f !important; 
        }
        .df-ui-btn.df-ui-close { 
            color: #ffffff !important; 
            background-color: transparent !important; 
        }
        .df-ui-btn.df-ui-close:hover { color: #e74c3c !important; }

        /* --- লোগো যুক্ত করার কাস্টম CSS --- */
        .df-ui-wrapper::before {
            content: "";
            /* আপনার দেওয়া Cloudinary লোগো লিংকটি এখানে বসানো হয়েছে */
            background-image: url('https://res.cloudinary.com/ewu5hckc/image/upload/v1789571686/cj5cuzsoopx1xap136ax.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            position: absolute;
            top: 20px; 
            left: 20px; 
            width: 150px; /* লোগোটি খুব বড় বা ছোট দেখালে এই মানটি পরিবর্তন করতে পারেন */
            height: 50px; /* লোগোর উচ্চতা অ্যাডজাস্ট করতে চাইলে এটি পরিবর্তন করুন */
            z-index: 99999; 
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <!-- dFlip সেটিংস -->
    <script>
        var dFlipLocation = "https://cdn.jsdelivr.net/npm/dflip/"; 
        var dFlip = dFlip || {};
        dFlip.defaults = {
            pdfRenderQuality: 2,
            maxZoom: 6,
            webgl: true, 
            backgroundColor: "#e9ecef", 
            pageMode: 1,
            soundEnable: true,
            hideControls: "download,print", 
            autoPlay: true,          
            autoPlayDuration: 3000,  
            autoPlayStart: true      
        };
    </script>

    <!-- PDF লোড হওয়ার পপ-আপ বাটন -->
    <div class="_df_button read-btn" source="magaz.pdf">ম্যাগাজিন পড়ুন</div>

    <!-- স্ক্রিপ্ট ফাইলগুলো -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
    
</body>
</html>
