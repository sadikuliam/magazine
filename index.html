<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Magazine Flipbook</title>

<meta name="description" content="Fast PDF Magazine Flipbook Reader">
<meta name="theme-color" content="#111827">

<!-- PageFlip CSS -->
<style>
:root{
    --bg:#0b1020;
    --panel:#111827;
    --panel2:#172033;
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#3b82f6;
    --accent2:#8b5cf6;
    --danger:#ef4444;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at top left, rgba(59,130,246,.13), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139,92,246,.14), transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* ================================
   HEADER
================================ */

.topbar{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 14px;
    background:rgba(10,15,30,.92);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    z-index:100;
}

.brand{
    min-width:0;
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:20px;
    background:
        linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:
        0 8px 25px rgba(59,130,246,.28);
}

.brand-text{
    min-width:0;
}

.brand-title{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brand-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:nowrap;
}

.tool-btn{
    width:40px;
    height:40px;
    border:0;
    outline:0;
    border-radius:11px;
    color:#fff;
    background:rgba(255,255,255,.07);
    cursor:pointer;
    display:grid;
    place-items:center;
    font-size:18px;
    transition:
        transform .16s ease,
        background .16s ease,
        opacity .16s ease;
}

.tool-btn:hover{
    background:rgba(255,255,255,.14);
}

.tool-btn:active{
    transform:scale(.93);
}

.tool-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.page-indicator{
    min-width:92px;
    height:40px;
    padding:0 10px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#dbeafe;
    background:rgba(59,130,246,.10);
    border:1px solid rgba(59,130,246,.20);
    font-size:13px;
    font-weight:700;
}

/* ================================
   READING AREA
================================ */

.reader{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:10px;
}

/* subtle background */
.reader::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            transparent 0,
            rgba(255,255,255,.02) 50%,
            transparent 100%
        );
}

/* ================================
   BOOK
================================ */

.book-container{
    position:relative;
    width:min(96vw,1500px);
    height:min(90vh,1100px);
    display:flex;
    justify-content:center;
    align-items:center;
}

#book{
    position:relative;
    width:100%;
    height:100%;
}

.page{
    background:#fff;
    overflow:hidden;
    box-shadow:
        0 0 0 1px rgba(0,0,0,.08),
        0 12px 35px rgba(0,0,0,.20);
}

.page canvas{
    display:block;
    width:100%;
    height:100%;
    background:#fff;
}

/* page loading */
.page-loading{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    color:#64748b;
    background:
        linear-gradient(
            135deg,
            #f8fafc,
            #e2e8f0
        );
}

.spinner{
    width:32px;
    height:32px;
    border-radius:50%;
    border:3px solid #cbd5e1;
    border-top-color:#3b82f6;
    animation:spin .75s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.page-loading small{
    font-size:11px;
}

/* ================================
   CENTER LOADER
================================ */

.loading-screen{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            rgba(15,23,42,.72),
            rgba(2,6,23,.96)
        );
    transition:
        opacity .35s ease,
        visibility .35s ease;
}

.loading-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-box{
    width:min(90%,380px);
    padding:28px 24px;
    border-radius:20px;
    text-align:center;
    background:rgba(17,24,39,.95);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:var(--shadow);
}

.loader-spinner{
    width:52px;
    height:52px;
    margin:0 auto 16px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#60a5fa;
    animation:spin .75s linear infinite;
}

.loader-title{
    font-size:18px;
    font-weight:800;
}

.loader-message{
    margin-top:7px;
    font-size:13px;
    line-height:1.5;
    color:#94a3b8;
}

.progress-wrap{
    margin-top:18px;
}

.progress-bar{
    height:6px;
    overflow:hidden;
    border-radius:99px;
    background:rgba(255,255,255,.08);
}

.progress-fill{
    width:0;
    height:100%;
    border-radius:99px;
    background:
        linear-gradient(
            90deg,
            #3b82f6,
            #8b5cf6
        );
    transition:width .15s linear;
}

/* ================================
   BOTTOM BAR
================================ */

.bottom-bar{
    height:44px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:5px 10px;
    background:rgba(10,15,30,.94);
    border-top:1px solid rgba(255,255,255,.07);
    color:#94a3b8;
    font-size:11px;
    z-index:100;
}

.status{
    display:flex;
    align-items:center;
    gap:6px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px rgba(34,197,94,.65);
}

/* ================================
   ERROR
================================ */

.error-screen{
    position:absolute;
    inset:0;
    z-index:60;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(2,6,23,.96);
}

.error-screen.show{
    display:flex;
}

.error-box{
    max-width:520px;
    width:100%;
    text-align:center;
    padding:30px 22px;
    border-radius:20px;
    background:#111827;
    border:1px solid rgba(239,68,68,.25);
    box-shadow:var(--shadow);
}

.error-icon{
    width:54px;
    height:54px;
    margin:0 auto 15px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(239,68,68,.12);
    font-size:25px;
}

.error-title{
    font-size:20px;
    font-weight:800;
}

.error-message{
    margin-top:9px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

.error-actions{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}

.error-btn{
    border:0;
    cursor:pointer;
    border-radius:10px;
    padding:10px 15px;
    font-weight:700;
    color:#fff;
    background:#2563eb;
}

/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    .topbar{
        height:58px;
        padding:7px 9px;
    }

    .brand-icon{
        width:37px;
        height:37px;
        flex-basis:37px;
        border-radius:10px;
    }

    .brand-title{
        font-size:14px;
    }

    .brand-sub{
        display:none;
    }

    .toolbar{
        gap:5px;
    }

    .tool-btn{
        width:36px;
        height:36px;
        border-radius:9px;
        font-size:16px;
    }

    .page-indicator{
        min-width:70px;
        height:36px;
        font-size:11px;
    }

    .reader{
        padding:5px;
    }

    .book-container{
        width:100%;
        height:100%;
    }

    .bottom-bar{
        height:40px;
        font-size:10px;
    }
}

@media(max-width:430px){

    .tool-btn:nth-child(1),
    .tool-btn:nth-child(2){
        display:none;
    }

    .page-indicator{
        min-width:65px;
    }
}

/* prevent selection while dragging */
#book,
#book *{
    user-select:none;
    -webkit-user-select:none;
}

/* smoother touch */
#book{
    touch-action:pan-y;
}
</style>
</head>

<script

<!-- ==============================================
     APPLICATION
     PDF.js 6.3.289
================================================ -->

<script type="module">

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";


/* ==============================================
   CONFIG
================================================ */

const PDF_URL = "./magaz.pdf";

const PDF_WORKER =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;


/*
    Rendering quality.

    1.00  = fastest
    1.25  = balanced
    1.50  = sharper
*/
const RENDER_SCALE = 1.25;


/*
    Number of pages rendered around
    the currently visible page.
*/
const PRELOAD_DISTANCE = 2;


/* ==============================================
   DOM
================================================ */

const book =
    document.getElementById("book");

const reader =
    document.getElementById("reader");

const loadingScreen =
    document.getElementById("loadingScreen");

const loaderTitle =
    document.getElementById("loaderTitle");

const loaderMessage =
    document.getElementById("loaderMessage");

const progressFill =
    document.getElementById("progressFill");

const errorScreen =
    document.getElementById("errorScreen");

const errorMessage =
    document.getElementById("errorMessage");

const pageIndicator =
    document.getElementById("pageIndicator");

const statusText =
    document.getElementById("statusText");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const openPdfBtn =
    document.getElementById("openPdfBtn");

const retryBtn =
    document.getElementById("retryBtn");

const errorOpenBtn =
    document.getElementById("errorOpenBtn");


/* ==============================================
   STATE
================================================ */

let pdfDoc = null;

let pageFlip = null;

let totalPages = 0;

let currentPage = 0;

let firstPageWidth = 595;

let firstPageHeight = 842;

let renderStates = [];

let loadingTask = null;

let initialized = false;


/* ==============================================
   BASIC HELPERS
================================================ */

function setStatus(text){
    statusText.textContent = text;
}


function setLoading(
    title,
    message,
    progress = null
){
    loaderTitle.textContent = title;

    loaderMessage.textContent = message;

    if(progress !== null){
        progressFill.style.width =
            `${Math.max(0, Math.min(100, progress))}%`;
    }
}


function showLoading(){
    loadingScreen.classList.remove("hidden");
}


function hideLoading(){
    loadingScreen.classList.add("hidden");
}


function showError(message){

    errorMessage.innerHTML =
        message;

    errorScreen.classList.add("show");

    hideLoading();
}


function hideError(){
    errorScreen.classList.remove("show");
}


function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}


/* ==============================================
   CREATE PAGE PLACEHOLDERS
================================================ */

function createPageElements(){

    book.innerHTML = "";

    const fragment =
        document.createDocumentFragment();

    for(let i = 0; i < totalPages; i++){

        const page =
            document.createElement("div");

        page.className = "page";

        page.dataset.page =
            String(i);

        /*
            Cover pages get hard density.
            This gives a more realistic magazine feel.
        */
        if(i === 0 || i === totalPages - 1){
            page.dataset.density = "hard";
        }

        const loading =
            document.createElement("div");

        loading.className =
            "page-loading";

        loading.innerHTML = `
            <div class="spinner"></div>
            <small>Loading page ${i + 1}</small>
        `;

        page.appendChild(loading);

        fragment.appendChild(page);
    }

    book.appendChild(fragment);
}


/* ==============================================
   RENDER ONE PDF PAGE
================================================ */

async function renderPage(index){

    if(
        index < 0 ||
        index >= totalPages
    ){
        return;
    }

    if(renderStates[index] === "done"){
        return;
    }

    if(renderStates[index] === "rendering"){
        return;
    }

    renderStates[index] = "rendering";

    try{

        const page =
            await pdfDoc.getPage(index + 1);

        /*
            Render a little higher than CSS display size.
            This keeps text and images sharp without
            rendering at extreme resolution.
        */
        const viewport =
            page.getViewport({
                scale: RENDER_SCALE
            });

        const canvas =
            document.createElement("canvas");

        const context =
            canvas.getContext(
                "2d",
                {
                    alpha:false,
                    willReadFrequently:false
                }
            );

        canvas.width =
            Math.ceil(viewport.width);

        canvas.height =
            Math.ceil(viewport.height);

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.display = "block";

        context.imageSmoothingEnabled = true;

        await page.render({
            canvasContext:context,
            viewport:viewport,
            intent:"display"
        }).promise;

        const pageElement =
            book.querySelector(
                `.page[data-page="${index}"]`
            );

        if(pageElement){

            pageElement.innerHTML = "";

            pageElement.appendChild(canvas);
        }

        renderStates[index] = "done";

    }catch(error){

        console.error(
            "Page rendering error:",
            index + 1,
            error
        );

        renderStates[index] = "error";

        const pageElement =
            book.querySelector(
                `.page[data-page="${index}"]`
            );

        if(pageElement){

            pageElement.innerHTML = `
                <div class="page-loading">
                    <div style="font-size:28px">⚠️</div>
                    <small>
                        Unable to render page ${index + 1}
                    </small>
                </div>
            `;
        }
    }
}


/* ==============================================
   PRELOAD NEARBY PAGES
================================================ */

async function preloadAround(index){

    const pages = [];

    /*
        Current page first.
        Then nearby pages.
    */
    pages.push(index);

    for(
        let distance = 1;
        distance <= PRELOAD_DISTANCE;
        distance++
    ){

        pages.push(index + distance);

        pages.push(index - distance);
    }

    /*
        Keep only valid pages.
    */
    const valid =
        pages.filter(
            p => p >= 0 && p < totalPages
        );

    /*
        Render sequentially so the browser is not
        flooded with a huge number of PDF render jobs.
    */
    for(const p of valid){

        await renderPage(p);

    }
}


/* ==============================================
   UPDATE UI
================================================ */

function updateUI(){

    if(!pageFlip){
        return;
    }

    currentPage =
        pageFlip.getCurrentPageIndex();

    /*
        Page number starts from 1 for readers.
    */
    const displayPage =
        clamp(
            currentPage + 1,
            1,
            totalPages
        );

    pageIndicator.textContent =
        `${displayPage} / ${totalPages}`;

    prevBtn.disabled =
        currentPage <= 0;

    nextBtn.disabled =
        currentPage >= totalPages - 1;

    setStatus(
        `Page ${displayPage} of ${totalPages}`
    );
}


/* ==============================================
   INITIALIZE FLIPBOOK
================================================ */

async function initializeFlipbook(){

    /*
        Get first page to determine actual PDF
        page dimensions.
    */
    const firstPage =
        await pdfDoc.getPage(1);

    const firstViewport =
        firstPage.getViewport({
            scale:1
        });

    firstPageWidth =
        firstViewport.width;

    firstPageHeight =
        firstViewport.height;


    /*
        Create placeholders for all PDF pages.
        Only nearby pages are actually rasterized.
    */
    createPageElements();


    /*
        Destroy previous instance if retrying.
    */
    if(pageFlip){

        try{
            pageFlip.destroy();
        }catch(_){}

        pageFlip = null;
    }


    /*
        PageFlip requires a base width/height.
        PDF dimensions provide a natural ratio.
    */

    pageFlip =
        new St.PageFlip(
            book,
            {
                width:Math.round(firstPageWidth),
                height:Math.round(firstPageHeight),

                size:"stretch",

                minWidth:250,
                maxWidth:900,

                minHeight:350,
                maxHeight:1300,

                drawShadow:true,

                maxShadowOpacity:.28,

                flippingTime:520,

                usePortrait:true,

                startZIndex:5,

                autoSize:true,

                showCover:true,

                mobileScrollSupport:true

            }
        );


    /*
        Listen BEFORE loading HTML pages.
    */
    pageFlip.on(
        "flip",
        async function(event){

            currentPage =
                event.data;

            updateUI();

            /*
                Render current page and nearby pages
                after turn.
            */
            preloadAround(currentPage);

        }
    );


    pageFlip.on(
        "changeOrientation",
        function(){

            updateUI();

        }
    );


    pageFlip.on(
        "init",
        function(){

            updateUI();

        }
    );


    /*
        Load page elements into PageFlip.
    */
    pageFlip.loadFromHTML(
        document.querySelectorAll(
            ".page"
        )
    );


    initialized = true;


    updateUI();


    /*
        First page must appear immediately.
    */
    await renderPage(0);


    /*
        Second page is important for desktop
        two-page viewing.
    */
    if(totalPages > 1){
        await renderPage(1);
    }


    /*
        Continue nearby loading without blocking UI.
    */
    requestAnimationFrame(() => {

        preloadAround(
            pageFlip.getCurrentPageIndex()
        );

    });
}


/* ==============================================
   LOAD PDF
================================================ */

async function loadPDF(){

    hideError();

    showLoading();

    initialized = false;

    setLoading(
        "Loading magazine...",
        "Connecting to PDF",
        8
    );

    setStatus(
        "Loading PDF..."
    );


    try{

        /*
            Cleanup previous PDF if needed.
        */
        if(pdfDoc){

            try{
                await pdfDoc.destroy();
            }catch(_){}

            pdfDoc = null;
        }


        /*
            Query parameter prevents a stale PDF
            after you replace magaz.pdf on GitHub.
        */
        const pdfURL =
            PDF_URL +
            "?v=" +
            Date.now();


        loadingTask =
            pdfjsLib.getDocument({

                url:pdfURL,

                /*
                    Streaming/range loading helps large PDFs.
                */
                disableStream:false,

                disableAutoFetch:false,

                rangeChunkSize:65536,

                /*
                    Keep network traffic focused.
                */
                useWorkerFetch:true,

                isOffscreenCanvasSupported:true

            });


        /*
            Download progress.
        */
        loadingTask.onProgress =
            function(progress){

                if(
                    progress &&
                    progress.total
                ){

                    const percent =
                        8 +
                        (
                            progress.loaded /
                            progress.total
                        ) * 62;

                    setLoading(
                        "Downloading magazine...",
                        `${Math.round(percent)}%`,
                        percent
                    );
                }
                else{

                    setLoading(
                        "Downloading magazine...",
                        "Receiving PDF...",
                        20
                    );

                }
            };


        pdfDoc =
            await loadingTask.promise;


        totalPages =
            pdfDoc.numPages;


        if(!totalPages){

            throw new Error(
                "PDF contains no pages."
            );
        }


        setLoading(
            "Preparing pages...",
            `${totalPages} pages detected`,
            72
        );


        renderStates =
            new Array(totalPages)
                .fill("idle");


        await initializeFlipbook();


        setLoading(
            "Ready",
            "Starting magazine reader...",
            100
        );


        /*
            Give the first rendered pages a tiny moment
            to paint before hiding loader.
        */
        setTimeout(
            () => {

                hideLoading();

                setStatus(
                    `Ready • ${totalPages} pages`
                );

            },
            180
        );


    }catch(error){

        console.error(
            "PDF loading error:",
            error
        );


        let message =
            "Could not load <b>magaz.pdf</b>.";


        if(
            error &&
            error.message
        ){

            message +=
                `<br><br>${error.message}`;
        }


        message +=
            `<br><br>
             Make sure <b>magaz.pdf</b>
             and <b>index.html</b>
             are in the same GitHub Pages folder.`;


        showError(
            message
        );

        setStatus(
            "PDF loading failed"
        );
    }
}


/* ==============================================
   NAVIGATION
================================================ */

function previousPage(){

    if(
        !pageFlip ||
        currentPage <= 0
    ){
        return;
    }

    pageFlip.flipPrev(
        "bottom"
    );
}


function nextPage(){

    if(
        !pageFlip ||
        currentPage >= totalPages - 1
    ){
        return;
    }

    pageFlip.flipNext(
        "bottom"
    );
}


/* ==============================================
   FULLSCREEN
================================================ */

async function toggleFullscreen(){

    try{

        if(!document.fullscreenElement){

            await reader.requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

        console.warn(
            "Fullscreen unavailable:",
            error
        );
    }
}


/* ==============================================
   OPEN ORIGINAL PDF
================================================ */

function openOriginalPDF(){

    window.open(
        PDF_URL,
        "_blank",
        "noopener,noreferrer"
    );
}


/* ==============================================
   BUTTON EVENTS
================================================ */

prevBtn.addEventListener(
    "click",
    previousPage
);

nextBtn.addEventListener(
    "click",
    nextPage
);

fullscreenBtn.addEventListener(
    "click",
    toggleFullscreen
);

openPdfBtn.addEventListener(
    "click",
    openOriginalPDF
);

retryBtn.addEventListener(
    "click",
    loadPDF
);

errorOpenBtn.addEventListener(
    "click",
    openOriginalPDF
);


/* ==============================================
   KEYBOARD
================================================ */

window.addEventListener(
    "keydown",
    function(event){

        /*
            Do not hijack browser shortcuts.
        */
        if(
            event.ctrlKey ||
            event.metaKey ||
            event.altKey
        ){
            return;
        }


        switch(event.key){

            case "ArrowLeft":
                event.preventDefault();
                previousPage();
                break;


            case "ArrowRight":
                event.preventDefault();
                nextPage();
                break;


            case "Home":

                if(pageFlip){

                    event.preventDefault();

                    pageFlip.turnToPage(0);

                    updateUI();

                    preloadAround(0);
                }

                break;


            case "End":

                if(pageFlip){

                    event.preventDefault();

                    const last =
                        totalPages - 1;

                    pageFlip.turnToPage(
                        last
                    );

                    updateUI();

                    preloadAround(last);
                }

                break;


            case "f":
            case "F":

                /*
                    Don't activate fullscreen while typing.
                */
                if(
                    document.activeElement &&
                    (
                        document.activeElement.tagName ===
                        "INPUT" ||
                        document.activeElement.tagName ===
                        "TEXTAREA"
                    )
                ){
                    return;
                }

                toggleFullscreen();

                break;
        }

    }
);


/* ==============================================
   TOUCH / DOUBLE TAP
================================================ */

let lastTap = 0;

reader.addEventListener(
    "touchend",
    function(){

        const now =
            Date.now();

        if(
            now - lastTap < 300
        ){

            toggleFullscreen();

        }

        lastTap = now;

    },
    {
        passive:true
    }
);


/* ==============================================
   WINDOW RESIZE
================================================ */

let resizeTimer = null;

window.addEventListener(
    "resize",
    function(){

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
            setTimeout(
                function(){

                    if(
                        pageFlip
                    ){

                        try{

                            pageFlip.update();

                        }catch(_){}

                    }

                },
                180
            );

    }
);


/* ==============================================
   VISIBILITY OPTIMIZATION
================================================ */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden
        ){

            setStatus(
                "Paused"
            );

        }else{

            updateUI();

        }

    }
);


/* ==============================================
   START
================================================ */

loadPDF();

</script>
